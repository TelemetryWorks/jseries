[workspace]
members = [
  "crates/jseries-core",
  "crates/jseries-schema",
  "crates/jseries-cli",
  "python",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
authors = ["TelemetryWorks"]
repository = "https://github.com/TelemetryWorks/jseries"
homepage = "https://github.com/TelemetryWorks/jseries"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
toml = "1.1.6"
criterion = "0.8.2"
proptest = "1.11.0"
rand = "0.9.5"
pyo3 = { version = "0.29.0", features = ["abi3-py310"] }
# 1.0.121 requires Rust 1.88; keep the workspace's Rust 1.86 MSRV.
trybuild = "=1.0.119"

[profile.dev]
panic = "unwind"

[profile.release]
debug = false
overflow-checks = true
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"
