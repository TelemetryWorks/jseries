[workspace]
members = ["crates/jseries-core", "crates/jseries-schema", "crates/jseries-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
license = "Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive", "rc"] }
toml = "1.1.6"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
