name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  CARGO_BUILD_JOBS: "2"
  UV_PYTHON_DOWNLOADS: never

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze and enforce quality gate
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, llvm-tools-preview
      - uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: cargo-llvm-cov@0.8.7
          fallback: none
      - name: Verify SonarCloud configuration
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN is not configured"; exit 1; }
          test -n "$SONAR_PROJECT_KEY" || { echo "SONAR_PROJECT_KEY is not configured"; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "SONAR_ORGANIZATION is not configured"; exit 1; }
      - name: Verify fixed project baseline (read-only)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
        run: python tools/check_sonar_baseline.py
      - name: Generate Rust coverage
        run: cargo llvm-cov --workspace --all-features --exclude jseries-python --locked --lcov --output-path lcov.info
      - name: Install locked Python development tools
        run: uv sync --directory python --locked --only-group dev --python python --no-python-downloads
      - name: Build the editable Rust-backed package
        run: uv run --directory python --locked --no-sync --offline --no-python-downloads python -m maturin develop --uv --locked
      - name: Generate Python coverage
        run: >-
          uv run --directory python --locked --no-sync --offline --no-python-downloads python -m pytest
          --cov=jseries --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Upload coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ github.sha }}
          path: |
            lcov.info
            python/coverage.xml
          if-no-files-found: error
          retention-days: 14
      - name: Run SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }}
            -Dsonar.sources=crates,tools,python
            -Dsonar.tests=crates,python
            -Dsonar.exclusions=crates/**/tests/**,crates/**/benches/**,python/tests/**,python/.venv/**,python/dist/**,python/dist-test/**,python/target/**,target/**
            -Dsonar.test.inclusions=crates/**/tests/**,crates/**/benches/**,python/tests/**
            -Dsonar.coverage.exclusions=crates/**/tests/**,crates/**/benches/**,tools/**,python/src/**,python/benchmarks/**,python/**/*.pyi
            -Dsonar.rust.lcov.reportPaths=lcov.info
            -Dsonar.python.coverage.reportPaths=python/coverage.xml
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
