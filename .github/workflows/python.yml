name: Python

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_BUILD_JOBS: "2"
  UV_PYTHON_DOWNLOADS: never

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - name: Install locked development tools
        run: uv sync --directory python --locked --only-group dev --python python --no-python-downloads
      - name: Build the editable Rust-backed package
        run: uv run --directory python --locked --no-sync --offline --no-python-downloads python -m maturin develop --uv --locked
      - name: Check Python formatting
        run: uv run --directory python --locked --no-sync --offline --no-python-downloads python -m ruff format --check . ../tools
      - name: Run Ruff
        run: uv run --directory python --locked --no-sync --offline --no-python-downloads python -m ruff check . ../tools
      - name: Run mypy
        run: uv run --directory python --locked --no-sync --offline --no-python-downloads python -m mypy
      - name: Run Pylint
        run: uv run --directory python --locked --no-sync --offline --no-python-downloads python -m pylint jseries tests benchmarks ../tools
      - name: Test with Python coverage
        run: >-
          uv run --directory python --locked --no-sync --offline --no-python-downloads python -m pytest
          --cov=jseries --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Verify native extension stubs
        run: uv run --directory python --locked --no-sync --offline --no-python-downloads python -m mypy.stubtest jseries
      - name: Upload Python coverage evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-coverage-${{ github.sha }}
          path: python/coverage.xml
          if-no-files-found: error
          retention-days: 14

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - name: Install locked development tools
        run: uv sync --directory python --locked --only-group dev --python python --no-python-downloads
      - name: Build the Rust-backed package
        run: uv run --directory python --locked --no-sync --offline --no-python-downloads python -m maturin build --locked --out dist-test
      - name: Install the built package
        run: uv run --project python --locked --no-sync --offline --no-python-downloads python tools/install_python_wheel.py python/dist-test
      - name: Verify installed native stubs
        run: uv run --project python --locked --no-sync --offline --no-python-downloads python -I -m mypy.stubtest jseries
      - name: Check Python syntax
        run: uv run --project python --locked --no-sync --offline --no-python-downloads python tools/check_python.py
      - name: Diagnose pytest console launcher
        run: >-
          uv run --project python --locked --no-sync --offline --no-python-downloads python -c
          "import shutil, subprocess, sys; print('interpreter:', sys.executable); launcher = shutil.which('pytest'); print('launcher:', launcher); result = subprocess.run([launcher, '--version'], check=False, capture_output=True, text=True) if launcher else None; print('launcher result:', result)"
      - name: Test the installed package
        run: uv run --project python --locked --no-sync --offline --no-python-downloads python -I -m pytest python/tests

  wheel-linux:
    name: Build Linux x86-64 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - name: Install locked development tools
        run: uv sync --directory python --locked --only-group dev --python python --no-python-downloads
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: x86_64
          manylinux: "2_28"
          maturin-version: v1.15.0
          args: --release --locked --out dist
          working-directory: python
      - name: Install and test the wheel
        run: |
          uv run --project python --locked --no-sync --offline --no-python-downloads python tools/install_python_wheel.py python/dist
          uv run --project python --locked --no-sync --offline --no-python-downloads python -I -m pytest python/tests
          uv run --project python --locked --no-sync --offline --no-python-downloads python -I -m mypy.stubtest jseries
      - name: Upload Linux wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jseries-wheel-linux-x86_64
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  wheel-windows:
    name: Build Windows x86-64 wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          architecture: x64
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - name: Install locked development tools
        run: uv sync --directory python --locked --only-group dev --python python --no-python-downloads
      - name: Build Windows wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: x64
          maturin-version: v1.15.0
          args: --release --locked --out dist
          working-directory: python
      - name: Install and test the wheel
        run: |
          uv run --project python --locked --no-sync --offline --no-python-downloads python tools/install_python_wheel.py python/dist
          uv run --project python --locked --no-sync --offline --no-python-downloads python -I -m pytest python/tests
          uv run --project python --locked --no-sync --offline --no-python-downloads python -I -m mypy.stubtest jseries
      - name: Upload Windows wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jseries-wheel-windows-x86_64
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 14
