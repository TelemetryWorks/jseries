name: Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - name: Install locked development tools
        run: uv sync --directory python --locked --only-group dev
      - name: Build the editable Rust-backed package
        run: uv run --directory python --locked --no-sync maturin develop --uv --locked
      - name: Check Python formatting
        run: uv run --directory python --locked --no-sync ruff format --check . ../tools
      - name: Run Ruff
        run: uv run --directory python --locked --no-sync ruff check . ../tools
      - name: Run mypy
        run: uv run --directory python --locked --no-sync mypy
      - name: Run Pylint
        run: uv run --directory python --locked --no-sync pylint jseries tests benchmarks ../tools
      - name: Test with Python coverage
        run: >-
          uv run --directory python --locked --no-sync pytest
          --cov=jseries --cov-branch --cov-report=term-missing
          --cov-report=xml:coverage.xml
      - name: Verify native extension stubs
        run: uv run --directory python --locked --no-sync python -m mypy.stubtest jseries
      - name: Upload Python coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ github.sha }}
          path: python/coverage.xml
          if-no-files-found: error
          retention-days: 14

  test:
    name: Python ${{ matrix.python-version }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - name: Install locked development tools
        run: uv sync --directory python --locked --only-group dev
      - name: Build the Rust-backed package
        run: uv run --directory python --locked --no-sync maturin build --locked --out dist-test
      - name: Install the built package
        run: uv run --project python --locked --no-sync python tools/install_python_wheel.py python/dist-test
      - name: Check Python syntax
        run: uv run --project python --locked --no-sync python tools/check_python.py
      - name: Test the installed package
        run: uv run --project python --locked --no-sync pytest python/tests

  wheel-linux:
    name: Build Linux x86-64 wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - name: Install locked development tools
        run: uv sync --directory python --locked --only-group dev
      - name: Build manylinux wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: x86_64
          manylinux: "2_28"
          maturin-version: v1.14.1
          args: --release --locked --out dist
          working-directory: python
      - name: Install and test the wheel
        run: |
          uv run --project python --locked --no-sync python tools/install_python_wheel.py python/dist
          uv run --project python --locked --no-sync pytest python/tests
      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: jseries-wheel-linux-x86_64
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 14

  wheel-windows:
    name: Build Windows x86-64 wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          architecture: x64
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.19"
          cache-dependency-glob: "python/uv.lock"
      - name: Install locked development tools
        run: uv sync --directory python --locked --only-group dev
      - name: Build Windows wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          target: x64
          maturin-version: v1.14.1
          args: --release --locked --out dist
          working-directory: python
      - name: Install and test the wheel
        run: |
          uv run --project python --locked --no-sync python tools/install_python_wheel.py python/dist
          uv run --project python --locked --no-sync pytest python/tests
      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: jseries-wheel-windows-x86_64
          path: python/dist/*.whl
          if-no-files-found: error
          retention-days: 14
