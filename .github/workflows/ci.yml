name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@v2
        with:
          tool: taplo@0.10.0
          fallback: none
      - name: Check TOML formatting
        run: taplo fmt --check
      - name: Lint TOML
        run: taplo check
      - name: Parse all TOML documents
        run: python tools/check_toml.py
      - run: cargo run --locked -p jseries-cli -- schema validate schemas
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: python tools/check_traceability.py
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --release
      - run: cargo bench --workspace --no-run --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.86.0"
      - run: cargo test --workspace --locked
