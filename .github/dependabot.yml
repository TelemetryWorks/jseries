version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Keep the workflow SHA pins; Dependabot updates pins and version comments.
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directories:
      - /
      - /crates/jseries-core
      - /crates/jseries-schema
      - /crates/jseries-cli
      - /python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /python
    # The exact uv 0.12.19 pin is incompatible with the inspected uv updater.
    # pip cannot refresh uv.lock; prevent manifest-only/range-widening PRs.
    versioning-strategy: lockfile-only
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
