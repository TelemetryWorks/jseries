[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "jseries"
dynamic = ["version"]
description = "Python bindings for the high-performance jseries Rust libraries"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "TelemetryWorks" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/TelemetryWorks/jseries"
Repository = "https://github.com/TelemetryWorks/jseries"

[dependency-groups]
build = ["maturin>=1.14.1,<2"]
lint = ["mypy>=1.19,<2", "pylint>=4,<5", "ruff>=0.12,<1", "tomli>=2,<3"]
test = ["pytest>=9,<10", "pytest-cov>=7,<8"]
dev = [
  { include-group = "build" },
  { include-group = "lint" },
  { include-group = "test" },
]

[tool.maturin]
bindings = "pyo3"
exclude = ["jseries/__pycache__/**"]
features = ["extension-module"]
manifest-path = "Cargo.toml"
module-name = "jseries._jseries"
python-source = "."

[tool.uv]
required-version = "==0.12.19"
default-groups = ["dev"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["dist", "dist-test"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PL", "RUF", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["PLR2004"]
"tests/**/*.py" = ["PLR2004"]

[tool.ruff.format]
docstring-code-format = true

[tool.pylint.main]
py-version = "3.10"
extension-pkg-allow-list = ["jseries._jseries"]
ignore-paths = ["^dist/", "^dist-test/", "^target/"]
ignore-patterns = [".*\\.pyi$"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint.reports]
score = false

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = ["."]
files = ["jseries", "tests", "benchmarks", "../tools"]
exclude = ["^dist/", "^dist-test/", "^target/"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["jseries"]

[tool.coverage.report]
show_missing = true

[tool.coverage.xml]
output = "coverage.xml"
