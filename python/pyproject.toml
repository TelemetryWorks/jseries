[build-system]
requires = ["maturin>=1.14.1,<2"]
build-backend = "maturin"

[project]
name = "jseries"
dynamic = ["version"]
description = "Python bindings for the high-performance jseries Rust libraries"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "TelemetryWorks" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Rust",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/TelemetryWorks/jseries"
Repository = "https://github.com/TelemetryWorks/jseries"

[tool.maturin]
bindings = "pyo3"
exclude = ["jseries/__pycache__/**"]
features = ["extension-module"]
manifest-path = "Cargo.toml"
module-name = "jseries._jseries"
python-source = "."
